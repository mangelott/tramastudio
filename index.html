      // Links de convite e de recuperação de palavra-passe abrem o ecrã para definir a palavra-passe.
      if (/type=(invite|recovery)/.test(location.hash) && location.pathname !== '/definir-palavra-passe') {
        history.replaceState(null, '', '/definir-palavra-passe' + location.hash)
      }
